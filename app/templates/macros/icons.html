{% macro icon(name, class_name='icon') -%}
<svg class="{{ class_name }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {% if name == 'activity' %}<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
  {% elif name == 'users' %}<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
  {% elif name == 'download' %}<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/>
  {% elif name == 'database' %}<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/>
  {% elif name == 'file-video' %}<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="m10 11 5 3-5 3v-6z"/>
  {% elif name == 'key-round' %}<path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4"/>
  {% elif name == 'shield-check' %}<path d="M20 13c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V5l8-3 8 3v8z"/><path d="m9 12 2 2 4-4"/>
  {% elif name == 'search' %}<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
  {% elif name == 'filter' %}<path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/>
  {% elif name == 'log-out' %}<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>
  {% elif name == 'sun' %}<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/>
  {% elif name == 'moon' %}<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/>
  {% elif name == 'refresh-cw' %}<path d="M21 12a9 9 0 0 1-15.1 6.6L3 16"/><path d="M3 21v-5h5M3 12A9 9 0 0 1 18.1 5.4L21 8"/><path d="M21 3v5h-5"/>
  {% elif name == 'lock-keyhole' %}<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4M12 15v3"/>
  {% elif name == 'circle-check' %}<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>
  {% elif name == 'circle-x' %}<circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/>
  {% elif name == 'clock' %}<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
  {% elif name == 'ban' %}<circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/>
  {% elif name == 'chevron-left' %}<path d="m15 18-6-6 6-6"/>
  {% elif name == 'chevron-right' %}<path d="m9 18 6-6-6-6"/>
  {% elif name == 'menu' %}<path d="M4 12h16M4 6h16M4 18h16"/>
  {% else %}<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>{% endif %}
</svg>
{%- endmacro %}
