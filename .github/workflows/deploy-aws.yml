name: Deploy AWS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - id: source
        env:
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          if [ -n "$WORKFLOW_SHA" ]; then
            echo "sha=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$DISPATCH_SHA" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.sha }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ steps.source.outputs.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: deploy
        env:
          APP_IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ steps.source.outputs.sha }}
          DEPLOY_SHA: ${{ steps.source.outputs.sha }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          escaped_app_ref=$(jq -rn --arg value "$APP_IMAGE" '$value | @sh')
          escaped_git_ref=$(jq -rn --arg value "$DEPLOY_SHA" '$value | @sh')
          escaped_server_dir=$(jq -rn --arg value "$DEPLOY_PATH" '$value | @sh')
          escaped_region=$(jq -rn --arg value "$AWS_REGION" '$value | @sh')
          escaped_registry=$(jq -rn --arg value "${{ steps.ecr.outputs.registry }}" '$value | @sh')
          IFS= read -r -d '' remote_command <<EOF || true
          APP_IMAGE=$escaped_app_ref
          DEPLOY_SHA=$escaped_git_ref
          DEPLOY_PATH=$escaped_server_dir
          AWS_REGION=$escaped_region
          REGISTRY=$escaped_registry
          compose() {
            APP_IMAGE="\$APP_IMAGE" docker compose -f docker-compose.yml -f docker-compose.prod.yml "\$@"
          }
          diagnostics() {
            cd "\$DEPLOY_PATH" 2>/dev/null || return
            compose ps || true
            compose logs --no-color --tail=200 admin nginx migrate || true
          }
          docker_config=\$(mktemp -d)
          export DOCKER_CONFIG="\$docker_config"
          trap 'rm -rf "\$docker_config"' EXIT
          if ! {
            git -c safe.directory="\$DEPLOY_PATH" -C "\$DEPLOY_PATH" fetch --depth=1 origin "\$DEPLOY_SHA" &&
            git -c safe.directory="\$DEPLOY_PATH" -C "\$DEPLOY_PATH" checkout --detach "\$DEPLOY_SHA" &&
            cd "\$DEPLOY_PATH" &&
            aws ecr get-login-password --region "\$AWS_REGION" | docker login --username AWS --password-stdin "\$REGISTRY" &&
            compose pull &&
            compose run --rm migrate &&
            compose up -d --remove-orphans &&
            compose up -d --no-deps --force-recreate nginx &&
            curl --fail --silent --show-error --retry 20 --retry-delay 3 --retry-all-errors http://localhost:8080/health/ready;
          }; then
            diagnostics
            exit 1
          fi
          EOF
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$(jq -cn --arg command "$remote_command" '{commands: [$command]}')" \
            --query 'Command.CommandId' \
            --output text)
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
      - env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          status=Pending
          for _ in $(seq 1 180); do
            status=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)
            case "$status" in
              Success|Cancelled|TimedOut|Failed|Cancelling) break ;;
            esac
            sleep 5
          done
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,StatusDetails:StatusDetails,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json
          test "$status" = "Success"
