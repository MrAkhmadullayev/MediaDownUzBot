name: Deploy AWS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - id: source
        env:
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          if [ -n "$WORKFLOW_SHA" ]; then
            echo "sha=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$DISPATCH_SHA" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.sha }}
      - uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com')
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString())
            core.info(JSON.stringify({ aud: claims.aud, sub: claims.sub }, null, 2))
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ steps.source.outputs.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: deploy
        env:
          APP_IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ steps.source.outputs.sha }}
          DEPLOY_SHA: ${{ steps.source.outputs.sha }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters commands="sudo -u ubuntu git -C $DEPLOY_PATH fetch --depth=1 origin $DEPLOY_SHA && sudo -u ubuntu git -C $DEPLOY_PATH checkout --detach $DEPLOY_SHA && cd $DEPLOY_PATH && aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin ${{ steps.ecr.outputs.registry }} && APP_IMAGE=$APP_IMAGE docker compose -f docker-compose.yml -f docker-compose.prod.yml pull && APP_IMAGE=$APP_IMAGE docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm migrate && APP_IMAGE=$APP_IMAGE docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans && curl --fail --retry 12 --retry-delay 5 http://localhost:8080/health/ready" \
            --query 'Command.CommandId' \
            --output text)
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
      - env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
